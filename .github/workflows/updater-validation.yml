# Manual cross-platform updater validation (NOT general CI).
#
# Purpose: occasional real-platform validation of the updater lifecycle on
# Linux, macOS, and Windows hosted runners. Runs ONLY via workflow_dispatch;
# regular commits and PRs never trigger it.
#
# Phase 7 contract: a green run here is required before any cross-platform
# support claims.

name: Updater Cross-Platform Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (reference, full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry (pinned to lockfile-compatible version)
        run: pipx install poetry==2.3.4
      - name: Show toolchain
        run: |
          python --version
          poetry --version
          git --version
      - name: Install dependencies (locked)
        run: poetry install --sync
      - name: Full test suite (includes updater integration)
        run: poetry run pytest -q --durations=30 --durations-min=0.5

  macos:
    name: macOS (focused + updater integration)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry (pinned)
        run: pipx install poetry==2.3.4
      - name: Show toolchain
        run: |
          python --version
          poetry --version
          git --version
          which poetry
          bash --version | head -1
          uname -a
      - name: Install dependencies (locked)
        run: poetry install --sync
      - name: Focused suites + updater integration
        run: >
          poetry run pytest -q --durations=30 --durations-min=0.5
          tests/test_update.py::test_symlink_ancestor_collision_aborts
          tests/test_update.py::test_updater_lock_blocks_second_instance
          tests/test_update.py::test_stop_proceeds_after_transient_lock_release
          tests/test_update.py::test_unexpected_flock_error_raises_platform_error
          tests/test_update.py::test_tracked_symlink_in_head_remains_allowed
          tests/test_update.py::test_docker_stop_blocked_by_active_updater_lock
          tests/test_update.py::test_stop_ordering_terminate_wait_then_force
          tests/test_update.py::test_stop_graceful_exit_skips_force_kill
          tests/test_update.py::test_posix_parsing_unchanged
          tests/test_update_platform.py
          tests/integration/updater/test_posix_lifecycle.py

  windows:
    name: Windows (focused + updater integration)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry (pinned)
        run: pipx install poetry==2.3.4
      - name: Toolchain diagnostics
        run: |
          python --version
          poetry --version
          git --version
      - name: Poetry resolution evidence
        run: |
          where.exe poetry
          python -c "import shutil; print(shutil.which('poetry'))"
      - name: Windows launcher inventory probes
        run: py -0p
        continue-on-error: true
      - name: Probe py -3.12
        run: py -3.12 --version
        continue-on-error: true
      - name: Probe py -3.11
        run: py -3.11 --version
        continue-on-error: true
      - name: Install dependencies (locked)
        run: poetry install --sync
      - name: Focused suites + updater integration
        run: >
          poetry run pytest -q --durations=30 --durations-min=0.5
          tests/test_update.py
          tests/test_update_platform.py
          tests/test_shutdown_transport.py
          tests/test_server_shutdown.py::test_windows_runner_uses_proactor_policy
          tests/test_update_check.py::test_windows_proactor_runs_real_subprocess
          tests/test_update_check.py::test_checker_git_subprocess_runs_under_proactor
          tests/test_update_check.py::test_windows_proactor_terminates_real_child
          tests/integration/updater/test_windows_lifecycle.py
